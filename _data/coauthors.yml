# Coautores com link na página Publications.
# O sobrenome (minúsculo, sem acento) é a chave; quando um autor com esse sobrenome e um dos
# primeiros nomes abaixo aparece em um artigo, o nome vira um link para a página dele.
# Exemplo (remova o "#" para usar):
#
# "toledo":
#   - firstname: ["Luís Felipe", "L. Felipe", "Felipe", "L. F."]
#     url: https://exemplo.com/felipe-toledo
