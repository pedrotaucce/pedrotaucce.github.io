# Pessoas do LaBESTA.
# Para cada pessoa: name, role, photo (opcional), bio (opcional, aceita Markdown) e lattes (opcional, URL do Lattes).
# Sem photo, aparece um espaço reservado. Sem bio ou lattes, esses itens simplesmente não aparecem.
# O enquadramento da foto (centrado no rosto) é calculado automaticamente a cada deploy.
# Só se quiser forçar outro enquadramento, acrescente photo_position (ex.: "50% 20%").

groups:
  - id: pi
    title: Principal Investigator
    wide: true
    people:
      - name: Pedro P. G. Taucci
        role: Lab Head
        affiliation: Department of Biological Sciences, School of Sciences, São Paulo State University (Unesp), Bauru
        photo: /assets/img/people/PPGT_jacare.jpeg
        lattes: "http://lattes.cnpq.br/6010051338306653"
        bio: |
          My research focuses on integrating disciplines such as bioacoustics, molecular phylogenetics, and morphology to explore the diversity and evolution of amphibians and reptiles. I am particularly interested in the processes driving biodiversity, and more recently, the interplay between genotype and phenotype has become a central theme in my work.

  - id: masters
    title: "Master's students"
    people:
      - name: Natalia Campos
        role: "Master's student, PPG Biodiversidade"
        photo: ""
        bio: |
          Nat is currently focusing on the cellular, behavioral, and genetic mechanisms of color change in the Neotropical treefrog *Boana prasina*. 
        lattes: "http://lattes.cnpq.br/3699951935813366"
      - name: Ana Carolina Carvalho
        role: "Master's student, PPG Biociências"
        photo: ""
        bio: |
          Ana is studying the diversification patterns of the leaf-litter frog *Adenomera marmorata* within the Brazilian Atlantic rainforest.
        lattes: "http://lattes.cnpq.br/3287758876490736"
      - name: Eldritch Sanches
        role: "Master's student, PPG Biociências"
        photo: /assets/img/people/Eldritch_Sanches.jpg
        bio: |
          For his master's study, Eldritch is interested in the phylogeography of the leaf-litter frog *Adenomera andrea* in the Amazon basin.
        lattes: "http://lattes.cnpq.br/4593752128798125"

  - id: undergrad
    title: Undergraduate students
    people:
      - name: Sofia Pacheco
        role: Undergraduate student
        photo: ""
        bio: |
          Sofia is interested in the bioacoustics of two *Ischnocnema* species (Anura: Brachycephalidae) and in developing automated methods to analyze their calls.
        lattes: "http://lattes.cnpq.br/1383893930523216"
      - name: Carolina Menardi
        role: Undergraduate student
        photo: /assets/img/people/Carolina_Menardi.jpg
        bio: |
          Carolina is currently studying the karyotype of two partially sympatric microhylid species of the genus *Elachistocleis*.
        lattes: "http://lattes.cnpq.br/4609628113998330"
      - name: Aline Pereira
        role: Undergraduate student
        photo: ""
        bio: |
          Aline is trying to understand why two sister leaf-litter frog species with adjacent geographic distributions in the Atlantic rainforest share alleles in their nuclear DNA.
        lattes: "http://lattes.cnpq.br/9752313917007383"
      - name: Pedro Lopes
        role: Volunteer intern
        photo: /assets/img/people/Pedro_Lopes.jpg
        bio: |
          Pedro studies molecular species delimitation in small toads of the genus *Dendrophryniscus*, based on mitochondrial DNA. 
        lattes: "http://lattes.cnpq.br/2022155821735573"
      - name: João Rangel
        role: Volunteer intern
        photo: /assets/img/people/Joao_Rangel.jpg
        bio: |
          João is currently focused on the taxonomy of a leaf-litter frog species that has not been found in the past 50 years: *Ischnocnema gualteri*.
        lattes: "http://lattes.cnpq.br/6871665971380494"
      - name: Nathália Alves
        role: Volunteer intern
        photo: ""
        bio: |
          Nathália is investigating knowledge gaps in the brachycephalid frog genus *Ischnocnema*, focusing on the Linnean, Wallacean, and Darwinian shortfalls.
        lattes: "http://lattes.cnpq.br/6740424908324076"
