# Pessoas do LaBESTA.
# Para cada pessoa: name, role, photo (opcional), bio (opcional, aceita Markdown) e lattes (opcional, URL do Lattes).
# O enquadramento da foto (centrado no rosto) é calculado automaticamente a cada deploy.
# Só se quiser forçar outro enquadramento, acrescente photo_position (ex.: "50% 20%").
# Sem photo, aparece um espaço reservado. Sem bio ou lattes, esses itens simplesmente não aparecem.

groups:
  - id: pi
    title: Principal Investigator
    wide: true
    people:
      - name: Pedro P. G. Taucci
        role: Lab Head
        affiliation: Department of Biological Sciences, School of Sciences, São Paulo State University (Unesp), Bauru
        photo: /assets/img/people/PPGT_jacare.jpeg
        lattes: "http://lattes.cnpq.br/6010051338306653"
        bio: |
          I am a broadly trained evolutionary zoologist, currently a Professor of Vertebrate Zoology at São Paulo State University (UNESP), Bauru, Brazil.

          My research focuses on integrating disciplines such as bioacoustics, molecular phylogenetics, and morphology to explore the diversity and evolution of tetrapods, with a special emphasis on herpetofauna (amphibians and reptiles). I am particularly interested in the processes driving biodiversity, and more recently, the interplay between genotype and phenotype has become a central theme in my work.

